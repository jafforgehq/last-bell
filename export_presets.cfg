; Web (prison) excludes: assets used only by flags that a web player cannot pass or by the old school and demo games.
;   zombies16: only with --zart. ui/sites: site cards of the old Town Board (loader falls back to no picture). objects/deck_*: old school yard World (deck_faces.gd).
;   pawns16/z0, z1: only with --dirs16dead. Kept on purpose: ui/theme (the title and HUD frames use it), pawns/z*, zr*, zrc*, zan (baked dead, loaded by default).
; Later desktop presets: use the same exclude_filter; the flags above need a desktop command line, so a desktop build that wants them must not exclude them.
[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/fonts/OFL.txt"
exclude_filter="README.md, tests/*, tools/*, docs/*, assets/zombies16/*, assets/ui/sites/*, assets/objects/deck_*, assets/pawns16/z0.png, assets/pawns16/z1.png"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

